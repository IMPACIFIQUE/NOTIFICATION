<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Center Right-to-Left Alert Box</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="btn-trigger" onclick="triggerAlert()">Click Me</button>

    <div id="alertOverlay" class="overlay">
        <div id="alertBox" class="alert-box">
            <div class="alert-header">
                <h3>Notice</h3>
            </div>
            <div class="alert-body">
                <p>This notification is locked to the top-center and moves right-to-left!</p>
            </div>
            <div class="alert-footer">
                <button class="btn-close" onclick="closeAlertImmediately()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('alertOverlay');
        const alertBox = document.getElementById('alertBox');
        let moveTimer;

        function triggerAlert() {
            alertBox.classList.remove('move-left');
            
            overlay.classList.add('show');

            moveTimer = setTimeout(function() {
                alertBox.classList.add('move-left');
                
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 400); 

            }, 5000); 
        }

        function closeAlertImmediately() {
            clearTimeout(moveTimer);
            overlay.classList.remove('show');
            setTimeout(() => {
                alertBox.classList.remove('move-left');
            }, 400);
        }
    </script>

</body>
</html>
