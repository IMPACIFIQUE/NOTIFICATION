<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Center Right-to-Left Alert Box</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #131624;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

   
        .btn-trigger {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            background-color: #00548d;
            color: white;
            transition: background-color 0.2s;
        }

        .btn-trigger:hover { 
            background-color: #0bcf25; 
        }

      
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .alert-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle light border */
            
            margin-top: 30px; 
            
            transform: translateX(150vw);
            
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1); 
        }

        .overlay.show .alert-box {
            transform: translateX(0);
        }

        .alert-box.move-left {
            transform: translateX(-150vw) !important;
        }

        .alert-header {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alert-header h3 {
            color: #ffffff;
        }

        .alert-body {
            padding: 20px;
            color: #cbd5e1; 
            font-size: 15px;
        }

        .alert-footer {
            padding: 12px 20px;
            text-align: right;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-close {
            background-color: #38bdf8; 
            color: #0f172a;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-close:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <button class="btn-trigger" onclick="triggerAlert()">Click Me</button>

    <div id="alertOverlay" class="overlay">
        <div id="alertBox" class="alert-box">
            <div class="alert-header">
                <h3>Notice</h3>
            </div>
            <div class="alert-body">
                <p>This notification is locked to the top-center and moves right-to-left!</p>
            </div>
            <div class="alert-footer">
                <button class="btn-close" onclick="closeAlertImmediately()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('alertOverlay');
        const alertBox = document.getElementById('alertBox');
        let moveTimer;

        function triggerAlert() {
            alertBox.classList.remove('move-left');
            
            overlay.classList.add('show');

            moveTimer = setTimeout(function() {
                alertBox.classList.add('move-left');
                
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 400); 

            }, 5000); 
        }

        function closeAlertImmediately() {
            clearTimeout(moveTimer);
            overlay.classList.remove('show');
            setTimeout(() => {
                alertBox.classList.remove('move-left');
            }, 400);
        }
    </script>

</body>
</html>
